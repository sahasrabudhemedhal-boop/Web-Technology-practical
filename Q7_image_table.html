
<!DOCTYPE html>
<html>
<head>
    <title>Image Inside Table</title>
</head>
<body>

    <h2>Student Information</h2>

    <table border="1" cellpadding="10">

        <tr>
            <th>Roll No.</th>
            <th>Name</th>
            <th>Photo</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Amit</td>
            <td>
                <img src="student1.jpg"
                     width="100" height="100"
                     alt="Amit Photo">
            </td>
        </tr>

        <tr>
            <td>102</td>
            <td>Neha</td>
            <td>
                <img src="student2.jpg"
                     width="100" height="100"
                     alt="Neha Photo">
            </td>
        </tr>

    </table>

</body>
</html>
